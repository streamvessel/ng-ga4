name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests (headless)
        run: pnpm exec ng test ng-ga4 --watch=false --browsers=ChromeHeadlessCI --no-progress

      - name: Build library
        run: pnpm run build

      - name: Resolve version
        id: v
        run: echo "version=$(node -p "require('./projects/ng-ga4/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fail if the tag already exists
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.v.outputs.version }} already exists. Bump the version in projects/ng-ga4/package.json first."
            exit 1
          fi

      # Trusted Publishing (OIDC) requires a recent npm; Node 22 ships npm 10.x.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --access public
        working-directory: dist/ng-ga4

      - name: Extract changelog section
        run: |
          awk '/^## \[${{ steps.v.outputs.version }}\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.v.outputs.version }}"
          git tag "$V"
          git push origin "$V"
          gh release create "$V" --title "$V" --notes-file release-notes.md
