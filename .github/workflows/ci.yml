name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # npm renders only the library README, so a relative or anchor-only link there
      # 404s on npmjs.com (fixed once in 0.2.1). Topic docs live under docs/ on GitHub.
      - name: Library README links are absolute
        run: |
          if grep -nP '\]\((?!https?://)' projects/ng-ga4/README.md; then
            echo "::error file=projects/ng-ga4/README.md::Use absolute https:// links; npm renders only this file."
            exit 1
          fi

      - name: Unit tests (headless)
        run: pnpm exec ng test ng-ga4 --watch=false --browsers=ChromeHeadlessCI --no-progress

      - name: Build library
        run: pnpm run build
