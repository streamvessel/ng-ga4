name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the actual behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal reproduction is worth ten descriptions.
    validations:
      required: true

  - type: input
    id: library-version
    attributes:
      label: "@stream-vessel/ng-ga4 version"
    validations:
      required: true

  - type: input
    id: angular-version
    attributes:
      label: Angular version
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Web application
        - Chrome extension (MV3)
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your NgGa4Config, with apiSecret and measurementId redacted.
      render: typescript
